    <rect x="0" y="420" width="900" height="140" fill="#171A1D"/>
    <rect x="48" y="452" width="248" height="80" rx="12" fill="#F1EFEA" opacity="0.2"/>
    <rect x="326" y="452" width="248" height="80" rx="12" fill="#F1EFEA" opacity="0.08"/>
    <rect x="604" y="452" width="248" height="80" rx="12" fill="#F1EFEA" opacity="0.08"/>
    <rect x="70" y="474" width="104" height="10" rx="5" fill="#171A1D" opacity="0.6"/>
    <rect x="70" y="494" width="160" height="8" rx="4" fill="#171A1D" opacity="0.34"/>
    <rect x="348" y="474" width="92" height="10" rx="5" fill="#F1EFEA" opacity="0.4"/>
    <rect x="348" y="494" width="150" height="8" rx="4" fill="#F1EFEA" opacity="0.22"/>
    <rect x="626" y="474" width="92" height="10" rx="5" fill="#F1EFEA" opacity="0.4"/>
    <rect x="626" y="494" width="150" height="8" rx="4" fill="#F1EFEA" opacity="0.22"/>
