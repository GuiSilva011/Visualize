      <path d="M731 200 L755 212 L731 224 Z" fill="#0F1113"/>
      <rect x="694" y="270" width="90" height="8" rx="4" fill="#F1EFEA" opacity="0.35"/>
      <rect x="694" y="288" width="64" height="7" rx="3.5" fill="#F1EFEA" opacity="0.2"/>

      <rect x="536" y="158" width="168" height="112" rx="12" fill="#E4E1DB" stroke="#171A1D" stroke-opacity="0.14" stroke-width="2"/>
      <rect x="554" y="178" width="86" height="8" rx="4" fill="#171A1D" opacity="0.32"/>
      <rect x="554" y="196" width="120" height="7" rx="3.5" fill="#171A1D" opacity="0.18"/>
      <rect x="554" y="222" width="132" height="30" rx="8" fill="#171A1D" opacity="0.1"/>
