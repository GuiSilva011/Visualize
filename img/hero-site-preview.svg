<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="presentation" aria-hidden="true">
  <title>Miniatura do site da VZ Connect</title>

  <defs>
    <linearGradient id="spHero" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F1EFEA"/>
      <stop offset="1" stop-color="#E4E1DB"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="0.78" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#171A1D" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#171A1D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3338"/>
      <stop offset="1" stop-color="#15181B"/>
    </linearGradient>
    <clipPath id="spClip"><rect x="0" y="0" width="900" height="560" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#spClip)">
    <rect width="900" height="560" fill="#F1EFEA"/>

    <!-- barra do navegador -->
    <rect x="0" y="0" width="900" height="52" fill="#E4E1DB"/>
    <circle cx="34" cy="26" r="6" fill="#A8ADB0"/>
    <circle cx="56" cy="26" r="6" fill="#A8ADB0"/>
    <circle cx="78" cy="26" r="6" fill="#A8ADB0"/>
    <rect x="108" y="15" width="260" height="22" rx="11" fill="#171A1D" opacity="0.07"/>
    <rect x="126" y="23" width="126" height="7" rx="3.5" fill="#171A1D" opacity="0.3"/>
    <line x1="0" y1="52" x2="900" y2="52" stroke="#171A1D" stroke-opacity="0.12" stroke-width="2"/>

    <!-- hero da página -->
    <rect x="0" y="52" width="900" height="368" fill="url(#spHero)"/>
    <rect x="0" y="52" width="900" height="368" fill="url(#spGlow)"/>

    <!-- menu do site -->
    <g transform="translate(0,52)">
      <g transform="translate(48 26)" fill="#171A1D" opacity="0.82">
        <g transform="translate(0,20) scale(0.019,-0.019)">
          <path d="M7040 6477 c0 -2 141 -131 314 -287 173 -157 315 -287 315 -290 -1 -3 -29 -30 -63 -60 -34 -30 -779 -707 -1656 -1505 -877 -797 -1646 -1497 -1709 -1554 -64 -58 -339 -308 -611 -556 -272 -248 -747 -680 -1055 -960 l-560 -509 -3 1505 -2 1506 -329 149 -329 149 1082 3 1081 2 421 383 c231 210 468 425 525 477 57 52 295 268 528 480 l423 385 -1922 3 -1921 2 -765 -695 -764 -696 0 -2189 0 -2190 2055 0 2054 0 173 158 c96 86 396 360 668 607 272 248 621 565 775 705 272 246 3230 2937 4365 3970 305 277 671 610 813 739 141 128 257 237 257 240 0 31 -26 31 -2092 31 -1137 0 -2068 -1 -2068 -3z"/>
        </g>
      </g>
      <rect x="452" y="32" width="54" height="9" rx="4.5" fill="#171A1D" opacity="0.28"/>
      <rect x="522" y="32" width="54" height="9" rx="4.5" fill="#171A1D" opacity="0.28"/>
      <rect x="592" y="32" width="54" height="9" rx="4.5" fill="#171A1D" opacity="0.28"/>
      <rect x="676" y="22" width="118" height="30" rx="15" fill="#171A1D" opacity="0.92"/>
      <rect x="820" y="24" width="32" height="26" rx="13" fill="none" stroke="#171A1D" stroke-opacity="0.3" stroke-width="2"/>
    </g>

    <!-- título e CTAs -->
    <rect x="48" y="164" width="392" height="24" rx="12" fill="#171A1D" opacity="0.86"/>
    <rect x="48" y="204" width="316" height="24" rx="12" fill="#171A1D" opacity="0.36"/>
    <rect x="48" y="256" width="268" height="10" rx="5" fill="#171A1D" opacity="0.22"/>
    <rect x="48" y="276" width="200" height="10" rx="5" fill="#171A1D" opacity="0.16"/>
    <rect x="48" y="318" width="146" height="40" rx="20" fill="#171A1D" opacity="0.94"/>
    <rect x="210" y="318" width="134" height="40" rx="20" fill="none" stroke="#171A1D" stroke-opacity="0.34" stroke-width="2"/>

