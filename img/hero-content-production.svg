<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 900" width="620" height="900" role="presentation" aria-hidden="true">
  <title>Bastidor de produção de conteúdo</title>

  <defs>
    <linearGradient id="cpBg" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22262A"/>
      <stop offset="0.55" stop-color="#131619"/>
      <stop offset="1" stop-color="#0A0C0D"/>
    </linearGradient>
    <radialGradient id="cpKey" cx="0.78" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#F1EFEA" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#F1EFEA" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#F1EFEA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cpBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1EFEA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A8ADB0" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cpBeam" x1="0.9" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#F1EFEA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F1EFEA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cpPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F1EFEA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F1EFEA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cpSil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="1" stop-color="#171B1F"/>
    </linearGradient>
    <linearGradient id="cpBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3338"/>
      <stop offset="1" stop-color="#14171A"/>
    </linearGradient>
    <clipPath id="cpClip"><rect x="0" y="0" width="620" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#cpClip)">
    <!-- ambiente -->
    <rect width="620" height="900" fill="url(#cpBg)"/>
    <rect width="620" height="900" fill="url(#cpKey)"/>
    <!-- linha do fundo (parede/chão) -->
    <path d="M0 612 H620" stroke="#F1EFEA" stroke-opacity="0.07" stroke-width="1.5"/>
    <ellipse cx="292" cy="792" rx="250" ry="72" fill="url(#cpPool)"/>

    <!-- feixe de luz do softbox -->
    <path d="M470 168 L618 214 L330 812 L150 792 Z" fill="url(#cpBeam)"/>

    <!-- softbox e tripé de luz -->
    <g>
      <g transform="rotate(-9 500 258)">
        <rect x="416" y="150" width="170" height="216" rx="12" fill="url(#cpBox)"/>
        <rect x="416" y="150" width="170" height="216" rx="12" fill="none" stroke="#F1EFEA" stroke-opacity="0.5" stroke-width="2"/>
        <path d="M416 258 H586 M501 150 V366" stroke="#08090A" stroke-opacity="0.16" stroke-width="2"/>
      </g>
      <path d="M497 372 V664" stroke="#6F757A" stroke-width="6" stroke-linecap="round"/>
      <path d="M497 664 L446 796 M497 664 L548 796 M497 664 V800" stroke="#6F757A" stroke-width="5" stroke-linecap="round"/>
      <circle cx="497" cy="664" r="9" fill="#A8ADB0"/>
    </g>

    <!-- microfone suspenso -->
    <g>
      <path d="M28 132 L286 246" stroke="#6F757A" stroke-width="7" stroke-linecap="round"/>
      <g transform="rotate(24 300 254)">
        <rect x="286" y="228" width="34" height="96" rx="17" fill="#22262A" stroke="#A8ADB0" stroke-opacity="0.6" stroke-width="2"/>
        <path d="M292 244 H314 M292 258 H314 M292 272 H314 M292 286 H314" stroke="#A8ADB0" stroke-opacity="0.5" stroke-width="2"/>
      </g>
      <circle cx="286" cy="246" r="8" fill="#A8ADB0"/>
    </g>

    <!-- silhueta em captação -->
    <g>
      <path d="M126 470 a44 44 0 1 1 88 0 a44 44 0 1 1 -88 0" fill="url(#cpSil)"/>
      <path d="M96 690 c0 -84 34 -142 74 -142 c40 0 74 58 74 142 z" fill="url(#cpSil)"/>
      <!-- braço ajustando a câmera -->
      <path d="M212 592 C 254 594, 282 610, 300 630" fill="none" stroke="#202428" stroke-width="26" stroke-linecap="round"/>
      <path d="M214 584 C 256 586, 284 602, 302 622" fill="none" stroke="#F1EFEA" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
      <!-- luz de contorno -->
      <path d="M202 434 a44 44 0 0 1 10 68" fill="none" stroke="#F1EFEA" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
      <path d="M226 572 c14 28 18 68 18 118" fill="none" stroke="#F1EFEA" stroke-opacity="0.52" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- câmera no tripé -->
    <g>
      <rect x="286" y="556" width="150" height="94" rx="12" fill="url(#cpBody)" stroke="#F1EFEA" stroke-opacity="0.22" stroke-width="2"/>
      <rect x="322" y="536" width="46" height="22" rx="6" fill="#22262A" stroke="#F1EFEA" stroke-opacity="0.16" stroke-width="2"/>
      <circle cx="368" cy="603" r="38" fill="#0F1113" stroke="#A8ADB0" stroke-opacity="0.55" stroke-width="3"/>
      <circle cx="368" cy="603" r="22" fill="#08090A" stroke="#F1EFEA" stroke-opacity="0.28" stroke-width="2"/>
      <path d="M352 588 a22 22 0 0 1 14 -8" fill="none" stroke="#F1EFEA" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
      <rect x="300" y="576" width="34" height="24" rx="4" fill="#F1EFEA" opacity="0.14"/>
      <circle cx="312" cy="626" r="5" fill="#F1EFEA" opacity="0.5"/>
      <!-- coluna e pernas -->
      <path d="M354 650 V704" stroke="#6F757A" stroke-width="8" stroke-linecap="round"/>
      <path d="M354 704 L292 826 M354 704 L416 826 M354 704 V832" stroke="#6F757A" stroke-width="6" stroke-linecap="round"/>
      <circle cx="354" cy="704" r="10" fill="#A8ADB0"/>
    </g>

    <!-- assinatura discreta -->
    <g transform="translate(44 806)" opacity="0.3" fill="#A8ADB0">
      <g transform="translate(0,44) scale(0.0055,-0.0055)">
        <path d="M7040 6477 c0 -2 141 -131 314 -287 173 -157 315 -287 315 -290 -1 -3 -29 -30 -63 -60 -34 -30 -779 -707 -1656 -1505 -877 -797 -1646 -1497 -1709 -1554 -64 -58 -339 -308 -611 -556 -272 -248 -747 -680 -1055 -960 l-560 -509 -3 1505 -2 1506 -329 149 -329 149 1082 3 1081 2 421 383 c231 210 468 425 525 477 57 52 295 268 528 480 l423 385 -1922 3 -1921 2 -765 -695 -764 -696 0 -2189 0 -2190 2055 0 2054 0 173 158 c96 86 396 360 668 607 272 248 621 565 775 705 272 246 3230 2937 4365 3970 305 277 671 610 813 739 141 128 257 237 257 240 0 31 -26 31 -2092 31 -1137 0 -2068 -1 -2068 -3z"/>
      </g>
    </g>

    <!-- vinheta -->
    <rect width="620" height="900" fill="none"/>
    <path d="M0 720 H620 V900 H0 Z" fill="#08090A" opacity="0.34"/>
  </g>
</svg>
